name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0). Leave empty to only build artifacts."
        required: false
        default: ""

permissions:
  contents: write

env:
  WAILS_VERSION: v2.12.0
  NODE_VERSION: "20"
  APP_NAME: "Zen Reader"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        run: |
          TAGS_ARG=""
          if [[ -n "${{ matrix.tags }}" ]]; then
            TAGS_ARG="-tags ${{ matrix.tags }}"
          fi
          wails build -clean -platform "${{ matrix.platform }}" -trimpath $TAGS_ARG

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/bin
          # The post-build hook renames the bundle; fall back to whatever .app exists.
          APP_DIR="$(ls -d *.app | head -n 1)"
          if [[ "$APP_DIR" != "${APP_NAME}.app" ]]; then
            mv "$APP_DIR" "${APP_NAME}.app"
          fi
          ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" \
            "../../ZenReader-${{ steps.version.outputs.version }}-macos-universal.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/bin -Filter *.exe | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "ZenReader-${{ steps.version.outputs.version }}-windows-amd64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C build/bin -czf "ZenReader-${{ steps.version.outputs.version }}-linux-amd64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenReader-${{ matrix.name }}
          path: |
            ZenReader-*.zip
            ZenReader-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event.inputs.tag != ''
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          name: Zen Reader ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.event.inputs.tag, '-') }}
          files: dist/*
